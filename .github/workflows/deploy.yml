name: Deploy to GitHub Pages

on:
  push:
    # main ist der massgebliche Branch. Die github-pages-Environment laesst
    # Deploys derzeit nur vom alten Default-Branch zu, deshalb laeuft die
    # Auslieferung uebergangsweise ueber claude/bold-cannon-i0b3wn.
    # Sobald main in Settings -> Environments -> github-pages freigegeben
    # (oder Default-Branch) ist, kann der zweite Eintrag entfallen.
    branches: ["main", "claude/bold-cannon-i0b3wn"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
