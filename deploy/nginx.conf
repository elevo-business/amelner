# ============================================================
# Amelner Getreidebrand — nginx im Container (Coolify)
#
# Wichtig: TLS wird davor von Traefik beendet. Im Container kommt nur
# HTTP an. Deshalb NIEMALS auf $scheme umleiten — das ergaebe eine
# Endlosschleife. Fuer das tatsaechliche Protokoll zaehlt allein der
# Header X-Forwarded-Proto.
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Relative Location-Kopfzeilen senden. Sonst baut nginx die Adresse aus
    # Schema und Port des Containers zusammen und schickt Besucher bei
    # internen Weiterleitungen auf http:// statt https://.
    absolute_redirect off;

    # ---- Auf https://amelner.de vereinheitlichen ----------------------
    # Nur wenn Traefik meldet, dass die Anfrage unverschluesselt kam.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://amelner.de$request_uri;
    }
    # www entfernen
    if ($host ~* ^www\.(.+)$) {
        return 301 https://amelner.de$request_uri;
    }

    # ---- Alte Adressen der Vorgaengerseite auffangen ------------------
    location = /produkte    { return 301 /likoere.html; }
    location = /geschichte  { return 301 /chronik.html; }
    location = /haendler    { return 301 /haendler.html; }
    location = /kontakt     { return 301 /bestellen.html; }
    location = /index.php   { return 301 /; }

    # ---- Fehlerseite --------------------------------------------------
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- Sicherheitskopfzeilen ---------------------------------------
    # Achtung: In den location-Bloecken unten darf kein add_header stehen.
    # nginx erbt add_header nicht, sobald ein Block ein eigenes setzt — die
    # Kopfzeilen hier waeren dann fuer genau diese Antworten verschwunden.
    # Deshalb steuern wir die Haltbarkeit ausschliesslich ueber „expires“,
    # das die Vererbung nicht antastet und Cache-Control selbst setzt.
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "SAMEORIGIN"                   always;

    # ---- Punktdateien nie ausliefern ---------------------------------
    location ~ /\. { deny all; }

    # ---- Bilder, Stil und Skript -------------------------------------
    # Bilddateien tragen die Breite im Namen und aendern sich nicht mehr,
    # deshalb duerfen sie lange liegenbleiben.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(css|js)$ {
        expires 30d;
        try_files $uri =404;
    }

    # ---- HTML kurz halten, damit Aenderungen schnell ankommen ---------
    location ~* \.html$ {
        expires 10m;
        try_files $uri =404;
    }

    # ---- Alles Uebrige ------------------------------------------------
    # Erweiterungslose Adressen zusaetzlich als .html versuchen, damit
    # /chronik genauso funktioniert wie /chronik.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- Komprimierung ------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/xml application/xml+rss image/svg+xml
               application/json;
    # JPEG und WebP sind bereits komprimiert und werden ausgelassen.
}
